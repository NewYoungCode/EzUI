<vbox id="windowRoot" size="620,640" class="app-root">
    <hbox id="titleBar" height="54" action="title" items-align="middle left" class="title-bar" style="padding: 0px 16px 0px 18px;">
        <vbox width="auto" height="auto" items-align="top left">
            <label width="auto" height="24" text="System Optimizer" align="left" class="title-text" event="none"></label>
            <label width="auto" height="16" text="系统优化" align="left" class="title-subtitle" event="none"></label>
        </vbox>
        <spacer></spacer>
        <label id="statusPill" width="72" height="26" text="READY" align="center" class="status-pill" event="none"></label>
        <label width="28" height="28" text="0" action="mini" class="window-btn window-font" style="margin: 0px 0px 0px 12px;"></label>
        <label width="28" height="28" text="r" action="close" class="window-btn window-font close-btn" style="margin: 0px 0px 0px 6px;"></label>
    </hbox>

    <vbox class="content" style="padding: 16px 18px 18px 18px;">
        <hbox height="72" items-align="middle left" class="summary-card" style="padding: 0px 16px 0px 16px;">
            <vbox width="auto" height="auto" items-align="top left">
                <label width="auto" height="20" text="选择要执行的优化" align="left" class="summary-title" event="none"></label>
                <label id="summaryText" width="auto" height="18" text="0 个项目待执行" align="left" class="summary-meta" event="none" style="margin: 6px 0px 0px 0px;"></label>
            </vbox>
            <spacer></spacer>
            <label width="84" height="34" text="HKCU" align="center" class="mini-chip" event="none"></label>
            <label width="92" height="34" text="Win11" align="center" class="mini-chip-accent" event="none" style="margin: 0px 0px 0px 8px;"></label>
        </hbox>

        <vbox height="342" class="option-panel" style="margin: 14px 0px 0px 0px; padding: 10px 10px 10px 10px;">
            <hbox height="48" items-align="middle left" class="option-row" style="padding: 0px 12px 0px 12px;">
                <checkbox id="ckGameBar" width="168" height="24" text="关闭 Game Bar" class="option-check"></checkbox>
                <label height="20" text="关闭 Xbox Game Bar 与 GameDVR 捕获开关" align="left" ellipsis="..." class="option-desc" event="none"></label>
            </hbox>

            <hbox height="48" items-align="middle left" class="option-row" style="margin: 8px 0px 0px 0px; padding: 0px 12px 0px 12px;">
                <checkbox id="ckThisPc" width="168" height="24" text="显示我的电脑" class="option-check"></checkbox>
                <label height="20" text="在桌面显示 This PC 图标并刷新资源管理器设置" align="left" ellipsis="..." class="option-desc" event="none"></label>
            </hbox>

            <hbox height="48" items-align="middle left" class="option-row" style="margin: 8px 0px 0px 0px; padding: 0px 12px 0px 12px;">
                <checkbox id="ckHibernate" width="168" height="24" text="关闭系统休眠" class="option-check"></checkbox>
                <label height="20" text="执行 powercfg -h off，可能弹出管理员授权" align="left" ellipsis="..." class="option-desc" event="none"></label>
            </hbox>

            <vbox height="86" class="option-row tall-row" style="margin: 8px 0px 0px 0px; padding: 10px 12px 10px 12px;">
                <hbox height="34" items-align="middle left">
                    <checkbox id="ckRedirect" width="188" height="24" text="重定向 C 盘缓存" class="option-check"></checkbox>
                    <input id="editRedirectTarget" width="210" height="34" placeholder="D 或 D:\Cache" text-align="middle left" class="target-input"></input>
                    <label width="auto" height="20" text="目标盘" align="left" class="input-caption" event="none" style="margin: 0px 0px 0px 10px;"></label>
                </hbox>
                <label width="100%" height="18" text="迁移用户目录与 Temp 缓存，目标不能是 C 盘。" align="left" ellipsis="..." class="option-note" event="none" style="margin: 8px 0px 0px 0px;"></label>
            </vbox>

            <hbox height="48" items-align="middle left" class="option-row" style="margin: 8px 0px 0px 0px; padding: 0px 12px 0px 12px;">
                <checkbox id="ckContextMenu" width="168" height="24" text="展开 Win11 右键菜单" class="option-check"></checkbox>
                <label height="20" text="启用经典右键菜单，重启资源管理器后完全生效" align="left" ellipsis="..." class="option-desc" event="none"></label>
            </hbox>
        </vbox>

        <hbox height="46" items-align="middle left" style="margin: 14px 0px 0px 0px;">
            <label width="auto" height="20" text="仅执行已勾选项" align="left" class="footer-note" event="none"></label>
            <spacer></spacer>
            <button id="btnApply" width="132" height="38" text="应用优化" class="primary-btn"></button>
        </hbox>

        <input id="resultLog" height="108" readonly="true" multiline="true" text-align="top left" text="勾选项目后点击应用。" class="result-log" style="margin: 10px 0px 0px 0px;"></input>
    </vbox>
</vbox>
