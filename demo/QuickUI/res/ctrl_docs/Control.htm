<vlist width="100%" height="100%" class="page" style="padding: 28px 30px 30px 30px;">
    <label height="auto" text="Control" align="left" class="title"></label>
    <label width="100%" height="auto" text="Control.h 是几乎所有可见控件的共同基类，真正需要补全的是“所有控件都继承了什么”：尺寸策略、可见性、样式状态、控件树操作、事件与刷新入口，而不是把它误解成某个可以单独拿来摆页面的 XML 标签。" align="left" class="summary" style="margin: 10px 0px 0px 0px;"></label>
    <hbox height="28" items-align="middle left" style="margin: 16px 0px 0px 0px;">
        <label width="auto" height="26" text="头文件 Control.h" align="center" class="pill" style="margin: 0px 0px 0px 0px;"></label>
        <label width="auto" height="26" text="基类 Object" align="center" class="pill-accent" style="margin: 0px 0px 0px 10px;"></label>
        <label width="auto" height="26" text="通用属性 / 无独立标签" align="center" class="pill" style="margin: 0px 0px 0px 10px;"></label>
    </hbox>
    <hbox width="100%" height="auto" items-align="top left" style="margin: 22px 0px 0px 0px;">
        <vbox width="520" height="auto" class="panel" style="padding: 18px 18px 18px 18px;">
            <label height="18" text="Live Demo" align="left" class="panel-title"></label>
            <label width="100%" height="auto" text="页面最外层统一由 vlist 承载滚动，内部示例和说明都回到普通布局容器，内容直接往下展开即可。" align="left" class="panel-subtitle" style="margin: 8px 0px 0px 0px;"></label>
            <vbox width="100%" height="auto" items-align="top left" style="margin: 14px 0px 0px 0px;">
                <vbox width="100%" height="auto" class="demo-card">
                    <label height="18" text="通用状态与行为" align="left" class="demo-title"></label>
                    <hbox height="40" items-align="middle left" style="margin: 14px 0px 0px 0px;">
                        <button width="128" height="38" text="主操作" class="btn-primary"></button>
                        <button width="120" height="38" text="禁用态" class="btn-secondary" disabled="true" style="margin: 0px 0px 0px 10px;"></button>
                        <label width="auto" height="26" text="tips / enable / visible" align="center" class="accent-chip" style="margin: 0px 0px 0px 10px;"></label>
                    </hbox>
                    <label width="100%" height="auto" text="这些状态和交互入口不是 Button 独有，而是大多数派生控件都直接继承自 Control 的共通能力。" align="left" class="demo-note" style="margin: 12px 0px 0px 0px;"></label>

                    </vbox>
