<vbox id="homeRoot" items-align="top left" style="padding: 22px 28px 22px 28px;">
    <hbox id="homeTopRow" height="30" items-align="middle left">
        <label id="homeGreeting" width="auto" height="24" text="Hi 早起的虫子被鸟吃，今天想听点什么" class="section-title"></label>
        <spacer></spacer>
        <label id="homeReportLink" width="auto" height="28" text="查看你的听歌报告  >" class="ghost-link" text-align="center" style="padding: 0px 12px 0px 12px;"></label>
    </hbox>

    <label id="homeCurrentMeta" width="100%" height="auto" text="喜欢、最近播放和本地下载会在这里自动汇总，首页也会在启动时刷新推荐。" class="section-copy" text-align="left" style="margin: 14px 0px 0px 0px;"></label>

    <hbox id="homeStatsRow" height="92" items-align="middle left" style="margin: 18px 0px 0px 0px;">
        <vbox class="stat-card stat-card-like" width="228" height="92" items-align="top left" style="margin: 0px 12px 0px 0px; padding: 16px 16px 16px 16px;">
            <label width="196" height="18" text="我的喜欢" class="stat-title" text-align="left"></label>
            <spacer></spacer>
            <label id="homeLikeCount" width="196" height="28" text="喜欢 0" class="stat-value" text-align="left"></label>
        </vbox>

        <vbox class="stat-card stat-card-recent" width="228" height="92" items-align="top left" style="margin: 0px 12px 0px 0px; padding: 16px 16px 16px 16px;">
            <label width="196" height="18" text="最近播放" class="stat-title" text-align="left"></label>
            <spacer></spacer>
            <label id="homeRecentCount" width="196" height="28" text="最近播放 0" class="stat-value" text-align="left"></label>
        </vbox>

        <vbox class="stat-card stat-card-download" width="228" height="92" items-align="top left" style="padding: 16px 16px 16px 16px;">
            <label width="196" height="18" text="本地下载" class="stat-title" text-align="left"></label>

            <label id="homeDownloadCount" width="196" height="28" text="本地下载 0" class="stat-value" text-align="left"></label>

    </hbox>

            <vbox event="none" width="172" items-align="top left" style="padding: 16px 0px 16px 16px;">

                    <label width="auto" height="18" text="启动自动刷新" class="hero-badge" event="none" style="margin: 0px 0px 0px 8px;"></label>

        </vbox>

        <vbox id="homeCardRecent" width="136" height="140" items-align="top left" class="feature-card feature-card-recent home-tile-card" style="margin: 0px 12px 0px 0px; padding: 12px 12px 12px 12px;">

            <label width="112" height="18" text="最近播放" class="feature-title" text-align="left" event="none" style="margin: 10px 0px 0px 0px;"></label>

        <vbox id="homeCardLyrics" width="136" height="140" items-align="top left" class="feature-card feature-card-lyrics home-tile-card" style="margin: 0px 12px 0px 0px; padding: 12px 12px 12px 12px;">

        </vbox>

        <vbox id="homeCardSearchMore" width="136" height="140" items-align="top left" class="feature-card feature-card-more home-tile-card" style="margin: 0px 0px 0px 0px; padding: 12px 12px 12px 12px;">
            <label width="112" height="60" class="feature-cover wide-cover-more" event="none"></label>
            <label width="112" height="18" text="继续搜索" class="feature-title" text-align="left" event="none" style="margin: 10px 0px 0px 0px;"></label>
            <label width="112" height="auto" text="直接跳回搜索页。" class="feature-copy" text-align="left" event="none" style="margin: 4px 0px 0px 0px;"></label>
