<hbox id="titleBarRoot" items-align="mid" action="title" style="padding: 0px 18px 0px 18px;">
    <hbox width="84" height="30" items-align="mid" action="title">
        <label id="titleBackBtn" width="30" height="30" text="" class="title-nav"></label>
        <label id="titleHomeBtn" width="30" height="30" text="⌂" class="title-nav" style="margin: 0px 0px 0px 8px;"></label>
    </hbox>

    <hbox id="searchShell" width="248" height="34" items-align="mid" style="margin: 0px 0px 0px 14px;">
        <label id="searchIcon" width="14" height="14" event="none"></label>
        <textbox id="searchBox" height="28" placeholder="搜索音乐" class="search-box" style="margin: 0px 0px 0px 8px;"></textbox>
    </hbox>

    <label id="brandMark" width="28" height="28" text="♪" style="margin: 0px 0px 0px 14px;"></label>
    <spacer></spacer>

    <hbox width="92" height="24" items-align="mid">
        <label width="24" height="24" text="0" action="mini" class="window-btn window-font"></label>
        <label width="24" height="24" text="1" action="max" class="window-btn window-font" style="margin: 0px 0px 0px 10px;"></label>
        <label width="24" height="24" text="r" action="close" class="window-btn window-font close-btn" style="margin: 0px 0px 0px 10px;"></label>
    </hbox>
</hbox>
