<vbox id="mainRoot">
    <hbox id="titleBar" height="44" items-align="mid left" action="title">
        <label size="18,18" style="background-image:url(res/QQ.png);margin-left:10px" event="none"></label>
        <label text="QQ" width="auto" style="font-size:14px;font-weight:700;margin-left:4px" event="none"></label>

        <hbox id="userChip" width="auto" height="28" items-align="mid left" event="none" style="margin-left:12px">
            <control size="24,24" style="margin-left:10px" event="none">
                <label width="100%" height="100%" style="background-image:url(res/head.png);border-radius:12px" event="none"></label>
                <label size="8,8" x="17" y="17" style="background-color:#2dd67b;border-radius:4px;border:1px solid #ffffff" event="none"></label>
            </control>
            <label text="早起的鸟儿被虫吃 ~" width="auto" style="font-size:13px;color:#2a2a2a;margin-left:8px;margin-right:12px" event="none"></label>
        </hbox>

        <spacer></spacer>

        <label class="titleGlyph" text="☁" event="none"></label>
        <label text="多云" width="auto" style="font-size:13px;color:#5b5b5b;margin-left:4px" event="none"></label>
        <label class="titleGlyph" text="◔" style="margin-left:16px" event="none"></label>

        <button class="winBtn" text="－" action="mini"></button>
        <button class="winBtn" text="□" action="max"></button>
        <button class="winBtn winClose" text="×" action="close"></button>
    </hbox>

    <hbox id="bodyCard">
        <vbox id="navRail" width="60" items-align="top center">
            <spacer height="10"></spacer>

            <radiobutton tabcontrol="contentTabs" checked="true" class="navBtn">
                <label width="100%" height="100%" style="background-image:url(res/xinxi.png);background-image-position:11px 11px;background-image-size:18px 18px" event="none"></label>
            </radiobutton>

            <radiobutton tabcontrol="contentTabs" class="navBtn">
                <label width="100%" height="100%" style="background-image:url(res/lxr.png);background-image-position:11px 11px;background-image-size:18px 18px" event="none"></label>
            </radiobutton>

            <radiobutton tabcontrol="contentTabs" class="navBtn">
                <label width="100%" height="100%" class="navTextIcon" text="友" event="none"></label>
            </radiobutton>

            <label class="navBtn navTextIcon" text="☆"></label>
            <control size="40,40" style="margin-top:6px">
                <label class="navInnerBtn navTextIcon" width="100%" height="100%" text="#"></label>
                <label size="8,8" x="29" y="7" style="background-color:#ff5b5b;border-radius:4px"></label>
            </control>
            <label class="navBtn navTextIcon" text="◫"></label>
            <label class="navBtn navTextIcon" text="⊙"></label>
            <label class="navBtn navTextIcon" text="⌂"></label>
            <label class="navBtn navTextIcon" text="⋮"></label>

            <spacer></spacer>

            <label class="navBtn" style="background-image:url(res/email.png);background-image-position:11px 11px;background-image-size:18px 18px"></label>
            <label class="navBtn navTextIcon" text="▢"></label>
            <label class="navBtn navTextIcon" text="☰"></label>
            <spacer height="10"></spacer>
        </vbox>

        <tabcontrol id="contentTabs">
            <iframe src="res/chatPage.htm"></iframe>
            <iframe src="res/contactPage.htm"></iframe>
            <iframe src="res/noticePage.htm"></iframe>
        </tabcontrol>
    </hbox>
</vbox>

<style>
    #mainRoot {
        background-color: #eaf1fd;
        border-radius: 12px;
    }

    #titleBar {
        background-color: #eaf1fd;
    }

    #userChip {
        background-color: rgba(255,255,255,0.72);
        border-radius: 14px;
    }

    .titleGlyph {
        width: auto;
        font-size: 16px;
        color: #60656f;
        margin-left: 10px;
    }

    .winBtn {
        width: 42px;
        height: 28px;
        margin-right: 2px;
        border: 0px solid #000000;
        background-color: #00000000;
        color: #424242;
        font-size: 14px;
        border-radius: 8px;
        text-align: mid center;
    }

    .winBtn:hover {
        background-color: rgba(0,0,0,0.06);
    }

    .winClose {
        margin-right: 8px;
    }

    .winClose:hover {
        background-color: #ff5b5b;
        color: #ffffff;
    }

    #bodyCard {
        margin: 0px 2px 2px 2px;
        background-color: #ffffff;
        border-radius: 12px;
    }

    #navRail {
        background-color: #ffffff;
        border-right: 1px solid #f0f0f0;
        border-top-left-radius: 12px;
        border-bottom-left-radius: 12px;
    }

    .navBtn {
        width: 40px;
        height: 40px;
        margin-top: 6px;
        border-radius: 12px;
        cursor: pointer;
        background-color: #00000000;
        color: #2f2f2f;
        font-size: 18px;
        text-align: mid center;
    }

    .navBtn:hover {
        background-color: #f1f4fa;
    }

    .navBtn:checked {
        background-color: #e8f2ff;
    }

    .navInnerBtn {
        background-color: #00000000;
        border-radius: 12px;
        cursor: pointer;
        text-align: mid center;
    }

    .navInnerBtn:hover {
        background-color: #f1f4fa;
    }

    .navTextIcon {
        color: #2f2f2f;
        font-size: 18px;
        text-align: mid center;
    }
</style>
