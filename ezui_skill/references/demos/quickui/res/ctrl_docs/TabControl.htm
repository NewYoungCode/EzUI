    <hbox height="28" items-align="middle left" style="margin: 16px 0px 0px 0px;">

        <label width="auto" height="26" text="基类 Control" align="center" class="pill-accent" style="margin: 0px 0px 0px 10px;"></label>
        <label width="auto" height="26" text="标签 &lt;tabcontrol&gt;" align="center" class="pill" style="margin: 0px 0px 0px 10px;"></label>

<vbox width="100%" height="auto" items-align="top left" style="margin: 14px 0px 0px 0px;">

            <label width="100%" height="auto" text="页面顺序就是切页顺序，别靠文案猜。" align="left" class="attr-line" style="margin: 8px 0px 0px 0px;"></label>
            <label width="100%" height="auto" text="标签：&lt;tabcontrol&gt;。" align="left" class="attr-line" style="margin: 8px 0px 0px 0px;"></label>
            <label height="18" text="使用提醒" align="left" class="section-title" style="margin: 18px 0px 0px 0px;"></label>

        </vbox>
    </hbox>
</vlist>
