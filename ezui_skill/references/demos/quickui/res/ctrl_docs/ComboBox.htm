<vlist width="100%" height="100%" class="page" style="padding: 28px 30px 30px 30px;">
    <label height="auto" text="ComboBox" align="left" class="title"></label>
    <label width="100%" height="auto" text="ComboBox.h 直接暴露了内部结构：它本质上是 HLayout + 只读 TextBox + 下拉按钮 + VListView 选项面板 + PopupWindow。补文档时需要把选项管理、值文本映射和回调补全。" align="left" class="summary" style="margin: 10px 0px 0px 0px;"></label>
    <hbox height="28" items-align="middle left" style="margin: 16px 0px 0px 0px;">
        <label width="auto" height="26" text="头文件 ComboBox.h" align="center" class="pill" style="margin: 0px 0px 0px 0px;"></label>
        <label width="auto" height="26" text="基类 HLayout" align="center" class="pill-accent" style="margin: 0px 0px 0px 10px;"></label>
        <label width="auto" height="26" text="标签 &lt;combobox&gt; / &lt;select&gt;" align="center" class="pill" style="margin: 0px 0px 0px 10px;"></label>
    </hbox>
    <hbox width="100%" height="auto" items-align="top left" style="margin: 22px 0px 0px 0px;">
        <vbox width="520" height="auto" class="panel" style="padding: 18px 18px 18px 18px;">
            <label height="18" text="Live Demo" align="left" class="panel-title"></label>
            <label width="100%" height="auto" text="页面最外层统一由 vlist 承载滚动，内部示例和说明都回到普通布局容器，内容直接往下展开即可。" align="left" class="panel-subtitle" style="margin: 8px 0px 0px 0px;"></label>
<vbox width="100%" height="auto" items-align="top left" style="margin: 14px 0px 0px 0px;">
                <vbox width="100%" height="auto" class="demo-card">
                    <label height="18" text="常见下拉" align="left" class="demo-title"></label>
                    <label height="18" text="环境选择" align="left" class="demo-note" style="margin: 12px 0px 0px 0px;"></label>
                    <combobox height="38" class="combo-shell" placeholder="请选择环境" style="margin: 6px 0px 0px 0px; padding-left: 5px;">
                        <option value="dev" text="开发环境" selected="true"></option>
                        <option value="test" text="测试环境"></option>
                        <option value="prod" text="生产环境"></option>
                    </combobox>
                    <label height="18" text="状态筛选" align="left" class="demo-note" style="margin: 16px 0px 0px 0px;"></label>
                    <select height="38" class="combo-shell" placeholder="请选择状态" style="margin: 6px 0px 0px 0px; padding-left: 5px;">
                        <option value="online" text="在线"></option>
                        <option value="idle" text="空闲" checked="true"></option>
                        <option value="offline" text="离线"></option>
                    </select>
                </vbox>
                <vbox width="100%" height="auto" class="demo-card" style="margin: 14px 0px 0px 0px;">
                    <label height="18" text="结构提示" align="left" class="demo-title"></label>
                    <hbox height="28" items-align="middle left" style="margin: 12px 0px 0px 0px;">
                        <label width="auto" height="26" text="TextBox" align="center" class="accent-chip"></label>
                        <label width="auto" height="26" text="CheckBox 箭头按钮" align="center" class="info-chip" style="margin: 0px 0px 0px 8px;"></label>
                        <label width="auto" height="26" text="VListView 选项面板" align="center" class="info-chip" style="margin: 0px 0px 0px 8px;"></label>
                    </hbox>
                    <label width="100%" height="auto" text="头文件已经把这些部件公开出来了，所以既可以走 XML option，也可以用代码 AddOption / SetValue / SelectIndex。" align="left" class="demo-note" style="margin: 12px 0px 0px 0px;"></label>
                </vbox>
            </vbox>
        </vbox>
        <spacer width="18"></spacer>
        <vbox width="350" height="auto" class="panel" style="padding: 18px 18px 18px 18px;">
            <label height="18" text="头文件速查" align="left" class="panel-title"></label>
            <label height="18" text="公开接口" align="left" class="section-title" style="margin: 16px 0px 0px 0px;"></label>
            <label width="100%" height="auto" text="SetPlaceholderText(const UIString&amp; text)" align="left" class="api-line" style="margin: 12px 0px 0px 0px;"></label>
            <label width="100%" height="auto" text="AddOption / RemoveOption / RemoveAllOptions" align="left" class="api-line" style="margin: 8px 0px 0px 0px;"></label>
            <label width="100%" height="auto" text="GetValue / SetValue / GetText / SetText" align="left" class="api-line" style="margin: 8px 0px 0px 0px;"></label>
            <label width="100%" height="auto" text="GetSelectedIndex / SelectIndex / IsExpanded / GetOptionPanel" align="left" class="api-line" style="margin: 8px 0px 0px 0px;"></label>

            <label height="18" text="适用场景" align="left" class="section-title" style="margin: 18px 0px 0px 0px;"></label>
            <label width="100%" height="auto" text="环境、状态、排序、分类等固定候选项。" align="left" class="body-line" style="margin: 12px 0px 0px 0px;"></label>
            <label width="100%" height="auto" text="空间紧张时替代一整排 RadioButton。" align="left" class="body-line" style="margin: 8px 0px 0px 0px;"></label>
            <label width="100%" height="auto" text="需要 value/text 双映射的设置项。" align="left" class="body-line" style="margin: 8px 0px 0px 0px;"></label>
        </vbox>
    </hbox>
    <hbox width="100%" height="auto" items-align="top left" style="margin: 18px 0px 0px 0px;">
        <vbox width="520" height="auto" class="panel" style="padding: 18px 18px 18px 18px;">
            <label height="18" text="XML + C++" align="left" class="panel-title"></label>
            <label width="100%" height="auto" text="挑最常抄的 XML 或 C++ 片段放在这里，直接对照头文件和当前页面即可复用。" align="left" class="panel-subtitle" style="margin: 8px 0px 0px 0px;"></label>
            <vbox width="100%" height="auto" class="code-box" style="margin: 14px 0px 0px 0px;">
            <label width="100%" height="auto" text="&lt;combobox id=&quot;envBox&quot; height=&quot;38&quot; placeholder=&quot;请选择环境&quot;&gt;" align="left" class="code-line" style="margin: 12px 0px 0px 0px;"></label>
            <label width="100%" height="auto" text="  &lt;option value=&quot;dev&quot; text=&quot;开发环境&quot; selected=&quot;true&quot;&gt;&lt;/option&gt;" align="left" class="code-line" style="margin: 8px 0px 0px 0px;"></label>
            <label width="100%" height="auto" text="  &lt;option value=&quot;prod&quot; text=&quot;生产环境&quot;&gt;&lt;/option&gt;" align="left" class="code-line" style="margin: 8px 0px 0px 0px;"></label>
            <label width="100%" height="auto" text="&lt;/combobox&gt;" align="left" class="code-line" style="margin: 8px 0px 0px 0px;"></label>
            <label width="100%" height="auto" text="envBox-&gt;SelectedChanged = [](ComboBox* sender, int index) { };" align="left" class="code-line" style="margin: 8px 0px 0px 0px;"></label>
            </vbox>
        </vbox>
        <spacer width="18"></spacer>
        <vbox width="350" height="auto" class="panel" style="padding: 18px 18px 18px 18px;">
            <label height="18" text="属性与提醒" align="left" class="panel-title"></label>
            <label height="18" text="XML / 标签" align="left" class="section-title" style="margin: 16px 0px 0px 0px;"></label>
            <label width="100%" height="auto" text="placeholder、align 会转发到内部 TextBox。" align="left" class="attr-line" style="margin: 12px 0px 0px 0px;"></label>
            <label width="100%" height="auto" text="option 子项可用 value、text、selected、checked。" align="left" class="attr-line" style="margin: 8px 0px 0px 0px;"></label>
            <label width="100%" height="auto" text="标签别名：&lt;combobox&gt; / &lt;select&gt;。" align="left" class="attr-line" style="margin: 8px 0px 0px 0px;"></label>
            <label width="100%" height="auto" text="value/text/options 不是通过 SetAttribute 批量处理的，常见做法是 option 子项或代码 AddOption。" align="left" class="attr-line" style="margin: 8px 0px 0px 0px;"></label>
            <label height="18" text="使用提醒" align="left" class="section-title" style="margin: 18px 0px 0px 0px;"></label>
            <label width="100%" height="auto" text="默认看到的是当前值，所以默认项要慎选。" align="left" class="note-line" style="margin: 12px 0px 0px 0px;"></label>
            <label width="100%" height="auto" text="选项很少且都很重要时，RadioButton 往往更直观。" align="left" class="note-line" style="margin: 8px 0px 0px 0px;"></label>
            <label width="100%" height="auto" text="如果要完全自定义下拉项，可重写 OnCreateOption。" align="left" class="note-line" style="margin: 8px 0px 0px 0px;"></label>
        </vbox>
    </hbox>
</vlist>
