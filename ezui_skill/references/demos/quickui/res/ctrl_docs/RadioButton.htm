<vlist width="100%" height="100%" class="page" style="padding: 28px 30px 30px 30px;">
    <label height="auto" text="RadioButton" align="left" class="title"></label>
    <label width="100%" height="auto" text="RadioButton.h 自身很薄，但它继承了 CheckBox 的选中接口，并在默认通知流程里和同级 RadioButton 构成互斥组，还能通过 tabcontrol 属性驱动 TabControl。" align="left" class="summary" style="margin: 10px 0px 0px 0px;"></label>
    <hbox height="28" items-align="middle left" style="margin: 16px 0px 0px 0px;">
        <label width="auto" height="26" text="头文件 RadioButton.h" align="center" class="pill" style="margin: 0px 0px 0px 0px;"></label>
        <label width="auto" height="26" text="基类 CheckBox" align="center" class="pill-accent" style="margin: 0px 0px 0px 10px;"></label>
        <label width="auto" height="26" text="标签 &lt;radiobutton&gt;" align="center" class="pill" style="margin: 0px 0px 0px 10px;"></label>
    </hbox>
    <hbox width="100%" height="auto" items-align="top left" style="margin: 22px 0px 0px 0px;">
        <vbox width="520" height="auto" class="panel" style="padding: 18px 18px 18px 18px;">
            <label height="18" text="Live Demo" align="left" class="panel-title"></label>
            <label width="100%" height="auto" text="页面最外层统一由 vlist 承载滚动，内部示例和说明都回到普通布局容器，内容直接往下展开即可。" align="left" class="panel-subtitle" style="margin: 8px 0px 0px 0px;"></label>
<vbox width="100%" height="auto" items-align="top left" style="margin: 14px 0px 0px 0px;">
                <vbox width="100%" height="auto" class="demo-card">
                    <label height="18" text="和 TabControl 组合" align="left" class="demo-title"></label>
                    <hbox height="28" items-align="middle left" style="margin: 12px 0px 0px 0px;">
                        <radiobutton width="64" height="20" text="概览" checked="true" tabcontrol="modeTabs" class="choice"></radiobutton>
                        <radiobutton width="64" height="20" text="设置" tabcontrol="modeTabs" class="choice" style="margin: 0px 0px 0px 12px;"></radiobutton>
                        <radiobutton width="64" height="20" text="日志" tabcontrol="modeTabs" class="choice" style="margin: 0px 0px 0px 12px;"></radiobutton>
                    </hbox>
                    <tabcontrol id="modeTabs" height="158" style="margin: 14px 0px 0px 0px;">
                        <vbox items-align="top left" class="tab-page" style="padding: 14px 14px 14px 14px;">
                            <label width="100%" height="auto" text="RadioButton 点击后，默认通知会按顺序切换到对应 TabControl 页面。" align="left" class="demo-note"></label>
                        </vbox>
                        <vbox items-align="top left" class="tab-page" style="padding: 14px 14px 14px 14px;">
                            <label width="100%" height="auto" text="这页适合放表单、开关和权限选项。" align="left" class="demo-note"></label>
                        </vbox>
                        <vbox items-align="top left" class="tab-page" style="padding: 14px 14px 14px 14px;">
                            <label width="100%" height="auto" text="同级 RadioButton 会自动互斥，不需要自己再写一遍切换逻辑。" align="left" class="demo-note"></label>
                        </vbox>
                    </tabcontrol>
                </vbox>
            </vbox>
        </vbox>
        <spacer width="18"></spacer>
        <vbox width="350" height="auto" class="panel" style="padding: 18px 18px 18px 18px;">
            <label height="18" text="头文件速查" align="left" class="panel-title"></label>
            <label height="18" text="公开接口" align="left" class="section-title" style="margin: 16px 0px 0px 0px;"></label>
            <label width="100%" height="auto" text="继承 CheckBox::SetCheck / GetCheck / CheckedChanged / CheckedStyle" align="left" class="api-line" style="margin: 12px 0px 0px 0px;"></label>
            <label width="100%" height="auto" text="OnMouseDown 会强制当前 RadioButton 置为选中" align="left" class="api-line" style="margin: 8px 0px 0px 0px;"></label>
            <label width="100%" height="auto" text="同级 RadioButton 的互斥在 Frame 默认通知里处理" align="left" class="api-line" style="margin: 8px 0px 0px 0px;"></label>
            <label width="100%" height="auto" text="tabcontrol=&quot;tabId&quot; 时会按同级 RadioButton 顺序切换 TabControl 页面" align="left" class="api-line" style="margin: 8px 0px 0px 0px;"></label>
            <label height="18" text="适用场景" align="left" class="section-title" style="margin: 18px 0px 0px 0px;"></label>
            <label width="100%" height="auto" text="单选模式切换、筛选模式、页签入口。" align="left" class="body-line" style="margin: 12px 0px 0px 0px;"></label>
            <label width="100%" height="auto" text="一组里必须且只能选一个值的场景。" align="left" class="body-line" style="margin: 8px 0px 0px 0px;"></label>
            <label width="100%" height="auto" text="和 TabControl 组合做局部页面切换。" align="left" class="body-line" style="margin: 8px 0px 0px 0px;"></label>
        </vbox>
    </hbox>
    <hbox width="100%" height="auto" items-align="top left" style="margin: 18px 0px 0px 0px;">
        <vbox width="520" height="auto" class="panel" style="padding: 18px 18px 18px 18px;">
            <label height="18" text="XML 写法" align="left" class="panel-title"></label>
            <label width="100%" height="auto" text="挑最常抄的 XML 或 C++ 片段放在这里，直接对照头文件和当前页面即可复用。" align="left" class="panel-subtitle" style="margin: 8px 0px 0px 0px;"></label>
            <vbox width="100%" height="auto" class="code-box" style="margin: 14px 0px 0px 0px;">
            <label width="100%" height="auto" text="&lt;radiobutton text=&quot;概览&quot; checked=&quot;true&quot; tabcontrol=&quot;modeTabs&quot;&gt;&lt;/radiobutton&gt;" align="left" class="code-line" style="margin: 12px 0px 0px 0px;"></label>
            <label width="100%" height="auto" text="&lt;radiobutton text=&quot;设置&quot; tabcontrol=&quot;modeTabs&quot;&gt;&lt;/radiobutton&gt;" align="left" class="code-line" style="margin: 8px 0px 0px 0px;"></label>
            <label width="100%" height="auto" text="&lt;tabcontrol id=&quot;modeTabs&quot;&gt;...&lt;/tabcontrol&gt;" align="left" class="code-line" style="margin: 8px 0px 0px 0px;"></label>
            </vbox>
        </vbox>
        <spacer width="18"></spacer>
        <vbox width="350" height="auto" class="panel" style="padding: 18px 18px 18px 18px;">
            <label height="18" text="属性与提醒" align="left" class="panel-title"></label>
            <label height="18" text="XML / 标签" align="left" class="section-title" style="margin: 16px 0px 0px 0px;"></label>
            <label width="100%" height="auto" text="checked: 初始选中状态。" align="left" class="attr-line" style="margin: 12px 0px 0px 0px;"></label>
            <label width="100%" height="auto" text="tabcontrol: 对应的 TabControl name / id。" align="left" class="attr-line" style="margin: 8px 0px 0px 0px;"></label>
            <label width="100%" height="auto" text="text / align / style:checked 继续来自 CheckBox / Label。" align="left" class="attr-line" style="margin: 8px 0px 0px 0px;"></label>
            <label width="100%" height="auto" text="常用标签：&lt;radiobutton&gt;。" align="left" class="attr-line" style="margin: 8px 0px 0px 0px;"></label>
            <label height="18" text="使用提醒" align="left" class="section-title" style="margin: 18px 0px 0px 0px;"></label>
            <label width="100%" height="auto" text="RadioButton 表达的是“单选”，不是多选开关。" align="left" class="note-line" style="margin: 12px 0px 0px 0px;"></label>
            <label width="100%" height="auto" text="入口顺序要和 TabControl 页面顺序保持一致。" align="left" class="note-line" style="margin: 8px 0px 0px 0px;"></label>
            <label width="100%" height="auto" text="如果本质只是独立开关，不要拿 RadioButton 冒充 CheckBox。" align="left" class="note-line" style="margin: 8px 0px 0px 0px;"></label>
        </vbox>
    </hbox>
</vlist>
