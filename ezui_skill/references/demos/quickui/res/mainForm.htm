<hbox class="app" style="padding: 18px 18px 18px 18px;">
    <!-- 固定导航骨架放在布局文件中。 -->
    <vbox width="220" class="sidebar" style="padding: 16px 16px 16px 16px;">
        <label height="auto" text="EzUI minimal demo" class="title"></label>
        <textbox id="search" height="38" placeholder="Filter pages..." class="search" style="margin: 14px 0px 0px 0px;"></textbox>

        <vlist id="navigation" style="margin: 14px 0px 0px 0px;">
            <radiobutton text="Overview" tabcontrol="pages" checked="true" class="nav-item"></radiobutton>
            <radiobutton text="Frame" tabcontrol="pages" class="nav-item" style="margin: 8px 0px 0px 0px;"></radiobutton>
        </vlist>
    </vbox>

    <!-- RadioButton 按同级顺序切换对应的 TabControl 页面。 -->
    <tabcontrol id="pages" class="content" style="margin: 0px 0px 0px 16px;">
        <vbox class="page" style="padding: 24px 24px 24px 24px;">
            <label height="auto" text="Layout + code-behind" class="page-title"></label>
            <label height="auto" text="main.cpp 绑定 TextChanged；固定结构和样式保留在 mainForm.htm。" class="copy" style="margin: 12px 0px 0px 0px;"></label>
        </vbox>

        <!-- Frame 加载独立控件树，隔离内部 ID、class 和样式。 -->
        <iframe src="res/frame_child.htm"></iframe>
    </tabcontrol>
</hbox>
